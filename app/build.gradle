plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def releaseKsPath = System.getenv('KEYSTORE_FILE')
def hasReleaseKs = releaseKsPath && new File(releaseKsPath).exists()
def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '0').toInteger()

android {
    namespace 'com.pauzfirst.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.pauzfirst.app"
        minSdk 24
        targetSdk 36
        versionCode 1000 + runNumber
        versionName "2.0.${runNumber}"
    }

    signingConfigs {
        release {
            if (hasReleaseKs) {
                storeFile new File(releaseKsPath)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            // The release key from the GitHub secrets. The build stops if the key is missing (see below),
            // so it can never ship signed with the debug key.
            signingConfig signingConfigs.release
            // R8 removes unused library code. The app's own classes are kept as-is (see proguard-rules.pro).
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
}

// A release build without the keystore secrets would be signed with the debug key, which Google Play rejects.
// Stop with a clear message instead.
gradle.taskGraph.whenReady { graph ->
    if ((graph.hasTask(':app:assembleRelease') || graph.hasTask(':app:bundleRelease')) && !hasReleaseKs) {
        throw new GradleException(
            "Release keystore is missing. Add the GitHub secrets ANDROID_KEYSTORE_BASE64, " +
            "KEYSTORE_PASSWORD and KEY_PASSWORD, then rebuild.")
    }
}
