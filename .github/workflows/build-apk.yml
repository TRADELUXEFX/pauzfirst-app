name: Build PauzFirst APK (Capacitor + Native TTS)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android || true

      - name: Add camera permission to AndroidManifest.xml
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.CAMERA' "$MANIFEST"; then
            sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />\n</manifest>#' "$MANIFEST"
          fi
          if ! grep -q 'FOREGROUND_SERVICE_MEDIA_PLAYBACK' "$MANIFEST"; then
            sed -i 's#</manifest>#    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>#' "$MANIFEST"
          fi
          if ! grep -q 'TtsForegroundService' "$MANIFEST"; then
            sed -i 's#</application>#    <service android:name="com.pauzfirst.app.TtsForegroundService" android:foregroundServiceType="mediaPlayback" android:exported="false" />\n</application>#' "$MANIFEST"
          fi
          cat "$MANIFEST"

      - name: Copy native TTS plugin files into Android project
        run: |
          mkdir -p android/app/src/main/java/com/pauzfirst/app
          cp android-native-tts-plugin/NativeTTSPlugin.java android/app/src/main/java/com/pauzfirst/app/
          cp android-native-tts-plugin/TtsForegroundService.java android/app/src/main/java/com/pauzfirst/app/

      - name: Install ImageMagick for icon generation
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Generate app icons from icon-512.png
        run: |
          ICON=www/icon-512.png
          declare -A SIZES=( [mdpi]=48 [hdpi]=72 [xhdpi]=96 [xxhdpi]=144 [xxxhdpi]=192 )
          for density in "${!SIZES[@]}"; do
            size=${SIZES[$density]}
            dir="android/app/src/main/res/mipmap-$density"
            mkdir -p "$dir"
            convert "$ICON" -resize ${size}x${size} "$dir/ic_launcher.png"
            convert "$ICON" -resize ${size}x${size} "$dir/ic_launcher_round.png"
            convert "$ICON" -resize ${size}x${size} "$dir/ic_launcher_foreground.png"
          done
          # On Android 8.0+ (API 26+), the launcher reads mipmap-anydpi-v26/ic_launcher.xml
          # first, which points at vector/webp placeholder drawables from the Capacitor
          # template — it ignores the density PNGs above entirely on any modern phone.
          # Delete that adaptive-icon override so the OS falls back to the PNGs we just
          # generated (our real logo) instead of showing the default placeholder icon.
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          # Also remove any leftover default webp icons so they can't shadow our PNGs.
          find android/app/src/main/res -maxdepth 1 -name 'mipmap-*' -type d -exec sh -c '
            rm -f "$1"/ic_launcher.webp "$1"/ic_launcher_round.webp "$1"/ic_launcher_foreground.webp
          ' _ {} \;

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Restore keystore from secret
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > ${{ github.workspace }}/android/app/release.keystore

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/android/app/release.keystore \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias=pauzfirst \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pauzfirst-apk
          path: android/app/build/outputs/apk/release/app-release.apk
