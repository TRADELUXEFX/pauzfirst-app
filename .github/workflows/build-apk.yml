name: Build PauzFirst APK (Native)

# Phone workflow: upload ANY zip into the "incoming" folder on github.com
# (Add file -> Upload files -> Commit to main). This workflow unpacks it into
# the repo, commits, deletes the zip, then builds the APK from that commit.
# Plain pushes and manual runs still just build.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

# A newer upload cancels an older still-running build so stale code never wins.
concurrency:
  group: build-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract any zip(s) found in incoming/ into repo root
        id: extract
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -e
          shopt -s nullglob dotglob
          zips=(incoming/*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "No zip files found in incoming/. Nothing to unpack."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"

          repo_lc=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]')

          for z in "${zips[@]}"; do
            echo "Unpacking $z ..."
            stage=$(mktemp -d)
            unzip -q -o "$z" -x "__MACOSX/*" "*/.DS_Store" ".DS_Store" -d "$stage"

            # Strip an extra wrapper folder (e.g. pauzfirst-app-main/app/... -> app/...)
            for pass in 1 2 3; do
              entries=("$stage"/*)
              [ ${#entries[@]} -eq 1 ] && [ -d "${entries[0]}" ] || break
              inner="${entries[0]}"
              name=$(basename "$inner")
              name_lc=$(echo "$name" | tr '[:upper:]' '[:lower:]')

              case "$name_lc" in
                app|incoming|.github|gradle) break ;;
              esac

              wrapper=false
              if [ "$name_lc" = "$repo_lc" ] || [[ "$name_lc" == "$repo_lc"-* ]] || [[ "$name_lc" == *-main ]] || [[ "$name_lc" == *-master ]]; then
                wrapper=true
              fi
              for marker in app incoming .github build.gradle settings.gradle gradle.properties; do
                [ -e "$inner/$marker" ] && wrapper=true
              done

              [ "$wrapper" = true ] || break
              echo "Removing wrapper folder: $name/"
              stage="$inner"
            done

            # GitHub blocks the default token from changing workflow files.
            rm -rf "$stage/.github/workflows"

            echo "Files being deployed:"
            (cd "$stage" && find . -type f | sed 's|^\./||' | head -200)

            cp -a "$stage"/. .
            rm -f "$z"
          done

      # To delete files, put DELETE_FILES.txt at the root of the zip: one
      # repo-relative path per line (blank lines and # comments ignored).
      - name: Delete files listed in DELETE_FILES.txt
        if: steps.extract.outputs.found == 'true'
        run: |
          set -e
          list="DELETE_FILES.txt"
          if [ ! -f "$list" ]; then
            echo "No $list in the zip - nothing to delete."
            exit 0
          fi
          deleted=0
          skipped=0
          while IFS= read -r line || [ -n "$line" ]; do
            p=$(printf '%s' "$line" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            case "$p" in
              ''|'#'*) continue ;;
            esac
            p="${p#./}"
            case "$p" in
              /*|*..*|.git|.git/*|.github|.github/*|incoming|incoming/*|build.gradle|app/build.gradle|settings.gradle|gradle.properties|DELETE_FILES.txt)
                echo "::warning::Skipped (protected or unsafe path): $p"
                skipped=$((skipped + 1))
                continue
                ;;
            esac
            if [ -f "$p" ]; then
              rm -f -- "$p"
              echo "Deleted: $p"
              deleted=$((deleted + 1))
            elif [ -e "$p" ]; then
              echo "::warning::Skipped (not a regular file): $p"
              skipped=$((skipped + 1))
            else
              echo "Not found (already gone): $p"
            fi
          done < "$list"
          rm -f "$list"
          echo "Deleted $deleted file(s), skipped $skipped."

      - name: Commit unpacked files
        if: steps.extract.outputs.found == 'true'
        id: commit_unpacked
        run: |
          git config user.name "deploy-bot"
          git config user.email "deploy-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed after extracting the zip - continuing anyway."
          else
            git commit -m "Deploy: unpack zip(s) from incoming/"
          fi
          if git push; then
            echo "Push succeeded."
          else
            echo "::error::Push of unpacked files was rejected (see log above)."
            echo "push_failed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Remove the zip even if the full push failed
        if: steps.extract.outputs.found == 'true' && steps.commit_unpacked.outputs.push_failed == 'true'
        run: |
          set -e
          git fetch origin main
          git checkout origin/main -- .
          shopt -s nullglob
          zips=(incoming/*.zip)
          if [ ${#zips[@]} -eq 0 ]; then exit 0; fi
          git rm -f "${zips[@]}"
          git commit -m "Deploy: remove zip(s) from incoming/ after failed deploy"
          git push origin HEAD:main

      - name: Stop here if the new code never made it to main
        if: steps.commit_unpacked.outputs.push_failed == 'true'
        run: |
          echo "::error::Your zip could not be pushed to main, so the build was stopped instead of building old code."
          exit 1

      - name: Build from the latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
          echo "Building from commit: $(git rev-parse HEAD)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Decode release keystore
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set - APK will be signed with the debug key and will NOT update over your installed app."
          fi

      - name: Build APK
        run: gradle assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: pauzfirst
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pauzfirst-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload APK to Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          tag_name: v2.0.${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
